x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - staging_minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    healthcheck:
      test: [ "CMD-SHELL", "mc ready local || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: greenmind-backend-staging:latest
    restart: always
    environment: &backend-environment
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-staging-storage-user}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-staging-storage-secret}}
      FIRMWARE_STORAGE_DIR: /app/firmware_data
      GATEWAY_RELEASE_DIR: /app/firmware_data/gateway_releases
      GATEWAY_RELEASE_SIGNING_PUBLIC_KEY_PATH: /run/greenmind/gateway-release-signing-public.pem
      MAX_WAV_UPLOAD_BYTES: ${MAX_WAV_UPLOAD_BYTES:-33554432}
      MAX_WAV_BUNDLE_FILES: ${MAX_WAV_BUNDLE_FILES:-2000}
      MAX_WAV_BUNDLE_BYTES: ${MAX_WAV_BUNDLE_BYTES:-2147483648}
      SENSOR_EXPORT_MAX_ROWS: ${SENSOR_EXPORT_MAX_ROWS:-250000}
      SENSOR_EXPORT_MAX_BYTES: ${SENSOR_EXPORT_MAX_BYTES:-67108864}
      SENSOR_EXPORT_MAX_KINDS: ${SENSOR_EXPORT_MAX_KINDS:-32}
      RETENTION_ENABLED: "${RETENTION_ENABLED:-false}"
      RETENTION_DRY_RUN: "${RETENTION_DRY_RUN:-true}"
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-24}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
      RETENTION_MAX_BATCHES_PER_RUN: ${RETENTION_MAX_BATCHES_PER_RUN:-10}
      RETENTION_WAV_DAYS: ${RETENTION_WAV_DAYS:-90}
      RETENTION_WAV_FEATURE_DAYS: ${RETENTION_WAV_FEATURE_DAYS:-730}
      RETENTION_ANOMALY_DAYS: ${RETENTION_ANOMALY_DAYS:-365}
      RETENTION_FLAC_DAYS: ${RETENTION_FLAC_DAYS:-365}
      RETENTION_SENSOR_READING_DAYS: ${RETENTION_SENSOR_READING_DAYS:-180}
      RETENTION_INGEST_LOG_DAYS: ${RETENTION_INGEST_LOG_DAYS:-30}
      RETENTION_GATEWAY_STATE_DAYS: ${RETENTION_GATEWAY_STATE_DAYS:-30}
      RETENTION_PAIRING_DAYS: ${RETENTION_PAIRING_DAYS:-30}
      RETENTION_PROVISIONING_DAYS: ${RETENTION_PROVISIONING_DAYS:-30}
      WAV_FEATURE_EXTRACTION_ENABLED: "${WAV_FEATURE_EXTRACTION_ENABLED:-true}"
      WAV_FEATURE_INTERVAL_MINUTES: ${WAV_FEATURE_INTERVAL_MINUTES:-5}
      WAV_FEATURE_ACTIVE_INTERVAL_SECONDS: ${WAV_FEATURE_ACTIVE_INTERVAL_SECONDS:-5}
      WAV_FEATURE_BATCH_SIZE: ${WAV_FEATURE_BATCH_SIZE:-20}
      WAV_FEATURE_MAX_ATTEMPTS: ${WAV_FEATURE_MAX_ATTEMPTS:-5}
      WAV_ANOMALY_ARCHIVE_ENABLED: "${WAV_ANOMALY_ARCHIVE_ENABLED:-false}"
      WAV_ANOMALY_CLIP_SECONDS: ${WAV_ANOMALY_CLIP_SECONDS:-30}
      WAV_FLAC_ARCHIVE_ENABLED: "${WAV_FLAC_ARCHIVE_ENABLED:-false}"
      EMBEDDED_BACKGROUND_WORKERS_ENABLED: "false"
      STORAGE_CAPACITY_BYTES: ${STORAGE_CAPACITY_BYTES:-107374182400}
      ENABLE_EXPERIMENTAL_PROVISIONING: "false"
      ENABLE_EXPERIMENTAL_BIOSIGNAL: "false"
      WEBSOCKET_MAX_CONNECTIONS: ${WEBSOCKET_MAX_CONNECTIONS:-500}
      WEBSOCKET_MAX_CONNECTIONS_PER_USER: ${WEBSOCKET_MAX_CONNECTIONS_PER_USER:-5}
      WEBSOCKET_MAX_CONNECTIONS_PER_IP: ${WEBSOCKET_MAX_CONNECTIONS_PER_IP:-20}
      WEBSOCKET_IDLE_TIMEOUT_SECONDS: ${WEBSOCKET_IDLE_TIMEOUT_SECONDS:-300}
      WEBSOCKET_SEND_TIMEOUT_SECONDS: ${WEBSOCKET_SEND_TIMEOUT_SECONDS:-2}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-re_staging_placeholder_key_for_testing}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@green-mind.ch}
      FRONTEND_URL: ${FRONTEND_URL:-https://test.green-mind.ch}
      CONTACT_FORM_TO: ${CONTACT_FORM_TO:-}
      # ASPSMS
      ASPSMS_USERKEY: ${ASPSMS_USERKEY:-}
      ASPSMS_PASSWORD: ${ASPSMS_PASSWORD:-}
      ASPSMS_SENDER_ID: ${ASPSMS_SENDER_ID:-GreenMind}
      GUNICORN_WORKERS: 1
      # The host Nginx connection reaches the container through this stack's
      # fixed bridge gateway. Trust only that exact peer and loopback.
      FORWARDED_ALLOW_IPS: "127.0.0.1,::1,${GREENMIND_DOCKER_GATEWAY:-172.28.21.1}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    volumes:
      - staging_firmware_data:/app/firmware_data
      - ${GATEWAY_RELEASE_SIGNING_PUBLIC_KEY_FILE:-./keys/gateway-release-signing-public.pem}:/run/greenmind/gateway-release-signing-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *default-logging

  feature-worker:
    image: greenmind-backend-staging:latest
    restart: always
    environment: *backend-environment
    command: [ "python", "-m", "app.workers.wav_features" ]
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging: *default-logging

  retention-worker:
    image: greenmind-backend-staging:latest
    restart: always
    environment: *backend-environment
    command: [ "python", "-m", "app.workers.retention" ]
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: greenmind-frontend-staging:latest
    restart: always
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./compose/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - staging_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  staging_postgres_data:
  staging_minio_data:
  staging_firmware_data:
  staging_prometheus_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${GREENMIND_DOCKER_SUBNET:-172.28.21.0/24}
          gateway: ${GREENMIND_DOCKER_GATEWAY:-172.28.21.1}
