# ─────────────────────────────────────────────────────────
# Nginx — Staging: test.green-mind.ch
# Install: sudo cp nginx/test.green-mind.ch.conf /etc/nginx/sites-available/greenmind-staging
#          sudo ln -sf /etc/nginx/sites-available/greenmind-staging /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d test.green-mind.ch
#          sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────

# Keep credentials out of access logs. Query strings are omitted entirely and
# public-observation bearer tokens embedded in paths are replaced.
map $uri $greenmind_staging_log_path {
    ~^(/api/v1/public/(?:observe|evaluate)/session/)[^/]+(.*)$ "$1[REDACTED]$2";
    default $uri;
}

log_format greenmind_staging_safe
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $greenmind_staging_log_path $server_protocol" '
    '$status $body_bytes_sent $request_time';

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name test.green-mind.ch;
    access_log /var/log/nginx/greenmind_staging_access.log greenmind_staging_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Staging
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.green-mind.ch;

    # TLS (managed by Certbot — run certbot after DNS is configured)
    ssl_certificate /etc/letsencrypt/live/test.green-mind.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.green-mind.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security
    server_tokens off;

    # Limits
    client_max_body_size 110m;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # Prevent search engine indexing of staging
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logs (separate from production)
    access_log /var/log/nginx/greenmind_staging_access.log greenmind_staging_safe;
    error_log  /var/log/nginx/greenmind_staging_error.log;

    location = /metrics {
        return 404;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Opt-in Direct pilot: independent receiver, old API continues below.
    location ^~ /api/v1/direct-ingest/ {
        client_max_body_size 64k;
        client_body_timeout 20s;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_redirect off;
        add_header Cache-Control "private, no-store" always;
    }

    # BEGIN GREENMIND GATEWAY CONTINUITY GUARD
    # Cloud control is paused; measurement/WAV uploads remain on the old API.
    location ~ ^/api/v1/gateway/(desired-state/?$|(app|config)-release/) {
        default_type application/json;
        return 503 '{"detail":"Gateway remote control paused for server maintenance"}';
    }
    location ~ ^/api/v1/gateways/[^/]+/commands/?$ {
        default_type application/json;
        return 503 '{"detail":"Gateway remote control paused for server maintenance"}';
    }
    # Installed v1.0.9 handles reset responses in heartbeat AND ingest uploads.
    location ~ ^/api/v1/(gateways/heartbeat|ingest)/?$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors on;
        error_page 410 = @gateway_continuity_unavailable;
    }
    location @gateway_continuity_unavailable {
        default_type application/json;
        return 503 '{"detail":"Gateway registration unavailable; keep local configuration"}';
    }
    # END GREENMIND GATEWAY CONTINUITY GUARD

    # API → Backend directly (bypass Next.js to preserve Set-Cookie headers)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        # WebSocket support (required for /api/v1/ws/*)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Allow long-running exports (sensor data ZIP) and WebSocket idle
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # Frontend (Next.js on staging port)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Private TLS access to Staging MinIO from the Staging Docker bridge only.
# This listener is not bound to the host's public network interface.
server {
    listen 172.28.21.1:9443 ssl;
    server_name test.green-mind.ch;
    ssl_certificate /etc/letsencrypt/live/test.green-mind.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.green-mind.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    access_log off;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_redirect off;
    }
}
