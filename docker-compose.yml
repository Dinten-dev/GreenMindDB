services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PGDATA_DIR:-postgres_data}:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_DATA_DIR:-minio_data}:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: [ "CMD-SHELL", "mc ready local || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: greenmind-backend:local
    restart: unless-stopped
    environment: &backend-environment
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FIRMWARE_STORAGE_DIR: /app/firmware_data
      GATEWAY_RELEASE_DIR: /app/firmware_data/gateway_releases
      GUNICORN_WORKERS: 1
      # Uvicorn 0.27 accepts literal trusted proxy IPs, not CIDR ranges.
      # Trust only loopback, the fixed bridge gateway used by host-local
      # access, and the fixed Next.js proxy address below.
      FORWARDED_ALLOW_IPS: "127.0.0.1,::1,${GREENMIND_DOCKER_GATEWAY:-172.28.10.1},${FRONTEND_PROXY_IP:-172.28.10.10}"
      # Empty in ordinary local development; signed-release activation fails closed.
      GATEWAY_RELEASE_SIGNING_PUBLIC_KEY_PATH: ${GATEWAY_RELEASE_SIGNING_PUBLIC_KEY_PATH:-}
      MAX_WAV_UPLOAD_BYTES: ${MAX_WAV_UPLOAD_BYTES:-33554432}
      MAX_WAV_BUNDLE_FILES: ${MAX_WAV_BUNDLE_FILES:-2000}
      MAX_WAV_BUNDLE_BYTES: ${MAX_WAV_BUNDLE_BYTES:-2147483648}
      SENSOR_EXPORT_MAX_ROWS: ${SENSOR_EXPORT_MAX_ROWS:-250000}
      SENSOR_EXPORT_MAX_BYTES: ${SENSOR_EXPORT_MAX_BYTES:-67108864}
      SENSOR_EXPORT_MAX_KINDS: ${SENSOR_EXPORT_MAX_KINDS:-32}
      RETENTION_ENABLED: "${RETENTION_ENABLED:-false}"
      RETENTION_DRY_RUN: "${RETENTION_DRY_RUN:-true}"
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-24}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
      RETENTION_MAX_BATCHES_PER_RUN: ${RETENTION_MAX_BATCHES_PER_RUN:-10}
      RETENTION_WAV_DAYS: ${RETENTION_WAV_DAYS:-90}
      RETENTION_WAV_FEATURE_DAYS: ${RETENTION_WAV_FEATURE_DAYS:-730}
      RETENTION_ANOMALY_DAYS: ${RETENTION_ANOMALY_DAYS:-365}
      RETENTION_FLAC_DAYS: ${RETENTION_FLAC_DAYS:-365}
      RETENTION_SENSOR_READING_DAYS: ${RETENTION_SENSOR_READING_DAYS:-180}
      RETENTION_INGEST_LOG_DAYS: ${RETENTION_INGEST_LOG_DAYS:-30}
      RETENTION_GATEWAY_STATE_DAYS: ${RETENTION_GATEWAY_STATE_DAYS:-30}
      RETENTION_PAIRING_DAYS: ${RETENTION_PAIRING_DAYS:-30}
      RETENTION_PROVISIONING_DAYS: ${RETENTION_PROVISIONING_DAYS:-30}
      WAV_FEATURE_EXTRACTION_ENABLED: "${WAV_FEATURE_EXTRACTION_ENABLED:-true}"
      WAV_FEATURE_INTERVAL_MINUTES: ${WAV_FEATURE_INTERVAL_MINUTES:-5}
      WAV_FEATURE_ACTIVE_INTERVAL_SECONDS: ${WAV_FEATURE_ACTIVE_INTERVAL_SECONDS:-5}
      WAV_FEATURE_BATCH_SIZE: ${WAV_FEATURE_BATCH_SIZE:-20}
      WAV_FEATURE_MAX_ATTEMPTS: ${WAV_FEATURE_MAX_ATTEMPTS:-5}
      WAV_ANOMALY_ARCHIVE_ENABLED: "${WAV_ANOMALY_ARCHIVE_ENABLED:-false}"
      WAV_ANOMALY_CLIP_SECONDS: ${WAV_ANOMALY_CLIP_SECONDS:-30}
      WAV_FLAC_ARCHIVE_ENABLED: "${WAV_FLAC_ARCHIVE_ENABLED:-false}"
      EMBEDDED_BACKGROUND_WORKERS_ENABLED: "false"
      STORAGE_CAPACITY_BYTES: ${STORAGE_CAPACITY_BYTES:-107374182400}
      ENABLE_EXPERIMENTAL_PROVISIONING: "${ENABLE_EXPERIMENTAL_PROVISIONING:-false}"
      ENABLE_EXPERIMENTAL_BIOSIGNAL: "${ENABLE_EXPERIMENTAL_BIOSIGNAL:-false}"
      WEBSOCKET_MAX_CONNECTIONS: ${WEBSOCKET_MAX_CONNECTIONS:-500}
      WEBSOCKET_MAX_CONNECTIONS_PER_USER: ${WEBSOCKET_MAX_CONNECTIONS_PER_USER:-5}
      WEBSOCKET_MAX_CONNECTIONS_PER_IP: ${WEBSOCKET_MAX_CONNECTIONS_PER_IP:-20}
      WEBSOCKET_IDLE_TIMEOUT_SECONDS: ${WEBSOCKET_IDLE_TIMEOUT_SECONDS:-300}
      WEBSOCKET_SEND_TIMEOUT_SECONDS: ${WEBSOCKET_SEND_TIMEOUT_SECONDS:-2}
      # Resend / Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@biolingo.org}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CONTACT_FORM_TO: ${CONTACT_FORM_TO:-}
      # Object storage
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # ASPSMS
      ASPSMS_USERKEY: ${ASPSMS_USERKEY:-}
      ASPSMS_PASSWORD: ${ASPSMS_PASSWORD:-}
      ASPSMS_SENDER_ID: ${ASPSMS_SENDER_ID:-GreenMind}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    volumes:
      - firmware_data:/app/firmware_data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  feature-worker:
    image: greenmind-backend:local
    restart: unless-stopped
    environment: *backend-environment
    command: [ "python", "-m", "app.workers.wav_features" ]
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  retention-worker:
    image: greenmind-backend:local
    restart: unless-stopped
    environment: *backend-environment
    command: [ "python", "-m", "app.workers.retention" ]
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      default:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.28.10.10}

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./compose/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=512MB
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  firmware_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${GREENMIND_DOCKER_SUBNET:-172.28.10.0/24}
          gateway: ${GREENMIND_DOCKER_GATEWAY:-172.28.10.1}
