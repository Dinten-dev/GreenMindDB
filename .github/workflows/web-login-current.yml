name: Web login current receiver

on:
  push:
    branches: ["fix/web-login-current-20261103", "feat/app-four-languages-current-20261103"]

permissions:
  contents: read

concurrency:
  group: web-login-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm test -- --ci --passWithNoTests --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/

  auth:
    name: Current receiver authentication regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Preserve authentication and session protections
        run: python -m pytest tests/test_auth_router.py tests/test_auth_utils.py tests/test_security_hardening.py tests/test_invitations_sessions.py tests/test_auth_concurrency.py -q
        env:
          SKIP_DOCKER_TESTS: "1"
          JWT_SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-chars"
