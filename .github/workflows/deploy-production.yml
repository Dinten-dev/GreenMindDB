name: Prepare Production Release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed full commit SHA with successful CI
        required: true
        type: string
      archive_exports_enabled:
        description: Include the prepared original-WAV export panel
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    uses: ./.github/workflows/package-release.yml
    with:
      revision: ${{ inputs.revision }}
      environment: production
      archive_exports_enabled: ${{ inputs.archive_exports_enabled }}
