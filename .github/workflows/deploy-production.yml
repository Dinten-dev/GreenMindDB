name: Deploy to Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup SSH Key
        env:
          DEPLOY_SSH_KEY_CONTENT: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS_CONTENT: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null /tmp/greenmind_deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY_CONTENT" > /tmp/greenmind_deploy_key
          install -m 600 /dev/null /tmp/greenmind_known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS_CONTENT" > /tmp/greenmind_known_hosts
          
      - name: Deploy to Production
        run: ./scripts/deploy.sh --env production
        env:
          DEPLOY_SSH_KEY_FILE: /tmp/greenmind_deploy_key
          DEPLOY_KNOWN_HOSTS_FILE: /tmp/greenmind_known_hosts
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Remove temporary SSH material
        if: always()
        run: rm -f /tmp/greenmind_deploy_key /tmp/greenmind_known_hosts
