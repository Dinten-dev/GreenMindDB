name: Export copy lifecycle

on:
  push:
    branches: ["fix/export-copy-cleanup-current-20261103"]

permissions:
  contents: read

jobs:
  export-copies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SKIP_DOCKER_TESTS: "1"
      JWT_SECRET_KEY: "ci-export-test-secret-key-at-least-32-characters"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit production dependencies
        run: python -m pip_audit --requirement requirements.txt --progress-spinner=off
      - name: Check changed export code
        run: |
          python -m ruff check app/visualization/archive_export_storage.py app/visualization/archive_exports.py app/visualization/archive_exports_worker.py app/visualization/archive_jobs.py app/raw_archive/reader.py app/raw_archive/archive_export_once.py app/raw_archive/export_checkpoint.py app/raw_archive/export_restore.py app/raw_archive/read_broker.py app/raw_archive/broker_client.py app/visualization/archive_export_reap.py tests/visualization/test_export_cleanup.py tests/visualization/test_archive_exports.py tests/raw_archive/test_archive_export_once.py tests/visualization/test_export_entrypoints.py tests/raw_archive/test_broker.py
          python -m ruff format --check app/visualization/archive_export_storage.py app/visualization/archive_exports.py app/visualization/archive_exports_worker.py app/visualization/archive_jobs.py app/raw_archive/reader.py app/raw_archive/archive_export_once.py app/raw_archive/export_checkpoint.py app/raw_archive/export_restore.py app/raw_archive/read_broker.py app/raw_archive/broker_client.py app/visualization/archive_export_reap.py tests/visualization/test_export_cleanup.py tests/visualization/test_archive_exports.py tests/raw_archive/test_archive_export_once.py tests/visualization/test_export_entrypoints.py tests/raw_archive/test_broker.py
      - name: Test real files, process locks, private sockets and checkpoints
        run: python -m pytest tests/visualization/test_export_cleanup.py tests/visualization/test_archive_exports.py tests/visualization/test_export_entrypoints.py tests/raw_archive/test_archive_export_once.py tests/raw_archive/test_export_checkpoint.py tests/raw_archive/test_reader.py tests/raw_archive/test_broker.py -v
      - name: Preserve API, tenant, pairing and Direct controls
        run: python -m pytest tests/test_public_access_revocation.py tests/test_public_observe.py tests/test_security_hardening.py tests/test_zone_access.py tests/test_typed_pairing.py tests/direct -q -m "not integration"
