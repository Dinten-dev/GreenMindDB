name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Backend: lint + test
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Audit production dependencies
        run: python -m pip_audit --requirement requirements.txt --progress-spinner=off

      - name: Lint with ruff
        run: python -m ruff check app/ tests/

      - name: Check Python formatting
        run: python -m ruff format --check app/ tests/

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short -m "not integration" --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60 2>&1 | tee pytest.log
        env:
          SKIP_DOCKER_TESTS: "1"
          JWT_SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-chars"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/pytest.log

  # ──────────────────────────────────────────────────────────────────
  # Frontend: lint + build + test
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm test -- --ci --passWithNoTests --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/

  direct-postgres:
    name: Direct concurrency and Legacy migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: direct_test
          POSTGRES_PASSWORD: local-direct-test-only
          POSTGRES_DB: direct_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U direct_test -d direct_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      timescale:
        image: timescale/timescaledb:2.17.2-pg15@sha256:d33b93c43b9db7a065f660847d4390d4a84ea1dd72395258aa8873f314de58c7
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: local-migration-only
          POSTGRES_DB: migration_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U migration_test -d migration_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing backend test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test Direct transactions and Legacy migration compatibility
        run: python -m pytest tests/direct/test_postgres.py tests/test_staging_migrations.py -v
        env:
          DIRECT_TEST_POSTGRES_URL: postgresql+psycopg2://direct_test:local-direct-test-only@127.0.0.1:5432/direct_test
          STAGING_TEST_DATABASE_URL: postgresql+psycopg2://migration_test:local-migration-only@127.0.0.1:5433/migration_test

  visualization-postgres:
    name: Visualization archives and Direct history
    runs-on: ubuntu-latest
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg15@sha256:d33b93c43b9db7a065f660847d4390d4a84ea1dd72395258aa8873f314de58c7
        env:
          POSTGRES_USER: visual_test
          POSTGRES_PASSWORD: local-visual-test-only
          POSTGRES_DB: visual_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U visual_test -d visual_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/visualization -v
        env:
          VISUAL_TEST_DATABASE_URL: postgresql+psycopg2://visual_test:local-visual-test-only@127.0.0.1:5434/visual_test
          JWT_SECRET_KEY: ci-test-secret-key-that-is-at-least-32-chars
      - name: Rehearse proxy switch and rollback under continuous HTTP ingestion
        run: python -m pytest tests/test_release_proxy_integration.py -v -s
        env:
          RELEASE_DOCKER_CONTEXT: default
          JWT_SECRET_KEY: ci-test-secret-key-that-is-at-least-32-chars
